<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Azure Static Web App</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #0078d4, #00188f);
            color: white;
            text-align: center;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 3rem;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        h1 { margin-bottom: 0.5rem; }
        p { font-size: 1.2rem; opacity: 0.9; }
        .status {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.5rem 1rem;
            background: #28a745;
            border-radius: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 ยินดีด้วย!</h1>
        <p>Azure Static Web App ของคุณทำงานได้สำเร็จแล้ว</p>
        <div class="status">สถานะ: ปรับใช้ (Deployed) สำเร็จ</div>
        <p style="margin-top: 2rem; font-size: 0.9rem;">สร้างโดย: Pattradanai</p>
    </div>
</body>
</html>
